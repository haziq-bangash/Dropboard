name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dropboard
          POSTGRES_PASSWORD: dropboard
          POSTGRES_DB: dropboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dropboard"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dropboard:dropboard@localhost:5432/dropboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @dropboard/api exec prisma migrate deploy
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dropboard/web build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results

  container:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        include:
          - app: api
            budget_mb: 200
          - app: web
            budget_mb: 350
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          tags: dropboard-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Smoke test and size budget
        run: |
          size=$(docker image inspect dropboard-${{ matrix.app }}:ci --format '{{.Size}}')
          echo "image size: $((size/1024/1024)) MB"
          [ "$size" -lt $((${{ matrix.budget_mb }}*1024*1024)) ] || { echo "image exceeds ${{ matrix.budget_mb }} MB"; exit 1; }
          docker run -d --name app -p 8080:8080 dropboard-${{ matrix.app }}:ci
          path=/health; [ "${{ matrix.app }}" = web ] && path=/
          for i in $(seq 1 15); do
            curl -fs localhost:8080$path >/dev/null && exit 0
            sleep 1
          done
          docker logs app
          exit 1
