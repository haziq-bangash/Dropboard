name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  container:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: dropboard-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test and size budget
        run: |
          size=$(docker image inspect dropboard-api:ci --format '{{.Size}}')
          echo "image size: $((size/1024/1024)) MB"
          [ "$size" -lt $((150*1024*1024)) ] || { echo "image exceeds 150 MB"; exit 1; }
          docker run -d --name api -p 8080:8080 dropboard-api:ci
          for i in $(seq 1 15); do
            curl -fs localhost:8080/healthz && exit 0
            sleep 1
          done
          docker logs api
          exit 1
