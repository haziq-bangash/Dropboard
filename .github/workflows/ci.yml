name: CI

# Runs on pull requests only. After a merge nothing is re-checked: the deploy builds what was already verified.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide what this change needs, so a docs-only change does not run browsers and builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      images: ${{ steps.diff.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          code=false; images=false
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            files="apps/api/x"
          fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in docs/*|*.md) ;; *) code=true ;; esac
            case "$f" in apps/*|packages/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.base.json|.dockerignore) images=true ;; esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "code=$code images=$images"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dropboard
          POSTGRES_PASSWORD: dropboard
          POSTGRES_DB: dropboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dropboard"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dropboard:dropboard@localhost:5432/dropboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @dropboard/api exec prisma migrate deploy
      - run: pnpm test

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dropboard
          POSTGRES_PASSWORD: dropboard
          POSTGRES_DB: dropboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dropboard"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dropboard:dropboard@localhost:5432/dropboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dropboard/api exec prisma migrate deploy
      - run: pnpm --filter @dropboard/api build
      # Next reuses its compiler cache between runs
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/**/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm --filter @dropboard/web build
      # The browser download is the slow part, so keep it between runs; system libraries are installed either way
      - id: pw-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results

  container:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: api
            budget_mb: 200
          - app: web
            budget_mb: 350
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          tags: dropboard-${{ matrix.app }}:ci
          # main's cache (written by deploys) is readable here, and this branch's own cache speeds up re-pushes
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Smoke test and size budget
        run: |
          size=$(docker image inspect dropboard-${{ matrix.app }}:ci --format '{{.Size}}')
          echo "image size: $((size/1024/1024)) MB"
          [ "$size" -lt $((${{ matrix.budget_mb }}*1024*1024)) ] || { echo "image exceeds ${{ matrix.budget_mb }} MB"; exit 1; }
          docker run -d --name app -p 8080:8080 dropboard-${{ matrix.app }}:ci
          path=/health; [ "${{ matrix.app }}" = web ] && path=/
          for _ in $(seq 1 15); do
            curl -fs localhost:8080$path >/dev/null && exit 0
            sleep 1
          done
          docker logs app
          exit 1

  # One required result for the whole pipeline: skipped jobs count as fine, failed or cancelled ones do not
  ci:
    if: always()
    needs: [changes, check, e2e, container]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qE 'failure|cancelled'; then exit 1; fi
