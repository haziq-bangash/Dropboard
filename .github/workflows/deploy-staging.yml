name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Skip when no database is configured
        if: env.DATABASE_URL == ''
        run: echo "DATABASE_URL secret not set, skipping migrations"
      - uses: actions/checkout@v4
        if: env.DATABASE_URL != ''
      - uses: pnpm/action-setup@v4
        if: env.DATABASE_URL != ''
      - uses: actions/setup-node@v4
        if: env.DATABASE_URL != ''
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.DATABASE_URL != ''
      - run: pnpm --filter @dropboard/api exec prisma migrate deploy
        if: env.DATABASE_URL != ''

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      matrix:
        app: [api, web]
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/dropboard/${{ matrix.app }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Deploy to Cloud Run
        run: |
          if [ "${{ matrix.app }}" = api ]; then
            ENV_VARS="WEB_ORIGIN=${{ vars.WEB_URL }},BETTER_AUTH_URL=${{ vars.WEB_URL }}"
            # Secrets are optional until Secret Manager is set up (see infra/setup-secrets.sh)
            SECRETS=""
            if gcloud secrets describe better-auth-secret >/dev/null 2>&1 && gcloud secrets describe database-url >/dev/null 2>&1; then
              LIST="BETTER_AUTH_SECRET=better-auth-secret:latest,DATABASE_URL=database-url:latest"
              # AI is optional: routes return 503 until an Anthropic key is stored
              if gcloud secrets describe anthropic-api-key >/dev/null 2>&1; then
                LIST="$LIST,ANTHROPIC_API_KEY=anthropic-api-key:latest"
              fi
              SECRETS="--update-secrets=$LIST"
            fi
            MEMORY=256Mi
          else
            ENV_VARS="API_URL=${{ vars.API_URL }}"
            SECRETS=""
            MEMORY=512Mi
          fi
          gcloud run deploy dropboard-${{ matrix.app }}             --image "$IMAGE"             --region "${{ vars.GCP_REGION }}"             --allow-unauthenticated             --min-instances 0             --max-instances 3             --concurrency 80             --cpu 1 --memory "$MEMORY"             --cpu-throttling             --cpu-boost             --set-env-vars "$ENV_VARS"             $SECRETS
      - name: Verify
        run: |
          url=$(gcloud run services describe dropboard-${{ matrix.app }} --region "${{ vars.GCP_REGION }}" --format='value(status.url)')
          path=/health; [ "${{ matrix.app }}" = web ] && path=/
          curl -fsS --retry 5 --retry-delay 3 "$url$path" >/dev/null
