name: Deploy staging

# Pull requests already ran the checks, so this only ships. Each app is rebuilt and redeployed only when what it
# is made of changed, judged against what is actually running, so a failed deploy heals itself on the next run.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      force:
        description: "Redeploy even if the running service already matches"
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # Fingerprint what each image is made of. The same inputs always give the same tag, so a rollback or an
  # unchanged app reuses an existing image instead of building again.
  plan:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.hash.outputs.api }}
      web: ${{ steps.hash.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: hash
        run: |
          shared=(package.json pnpm-workspace.yaml pnpm-lock.yaml tsconfig.base.json .dockerignore packages)
          echo "api=$(git ls-tree -r HEAD "${shared[@]}" apps/api | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "web=$(git ls-tree -r HEAD "${shared[@]}" apps/web | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

  # Always runs, in parallel with the builds: schema changes must land before the new code does
  migrate:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Skip when no database is configured
        if: env.DATABASE_URL == ''
        run: echo "DATABASE_URL secret not set, skipping migrations"
      - uses: actions/checkout@v4
        if: env.DATABASE_URL != ''
      - uses: pnpm/action-setup@v4
        if: env.DATABASE_URL != ''
      - uses: actions/setup-node@v4
        if: env.DATABASE_URL != ''
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.DATABASE_URL != ''
      - run: pnpm --filter @dropboard/api exec prisma migrate deploy
        if: env.DATABASE_URL != ''

  build:
    needs: plan
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      matrix:
        app: [api, web]
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/dropboard/${{ matrix.app }}:${{ matrix.app == 'api' && needs.plan.outputs.api || needs.plan.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Is this image already built?
        id: exists
        run: |
          if gcloud artifacts docker images describe "$IMAGE" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE already exists, nothing to build"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.found != 'true'
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  release:
    needs: [plan, migrate, build]
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      matrix:
        app: [api, web]
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/dropboard/${{ matrix.app }}:${{ matrix.app == 'api' && needs.plan.outputs.api || needs.plan.outputs.web }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run when it differs from what is running
        run: |
          if [ "${{ matrix.app }}" = api ]; then
            ENV_VARS="WEB_ORIGIN=${{ vars.WEB_URL }},BETTER_AUTH_URL=${{ vars.WEB_URL }}"
            # AI provider is chosen by configuration (see apps/api/src/ai/providers/index.ts)
            if [ -n "${{ vars.AI_PROVIDER }}" ]; then
              ENV_VARS="$ENV_VARS,AI_PROVIDER=${{ vars.AI_PROVIDER }},GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }}"
            fi
            if [ -n "${{ vars.AI_MODEL }}" ]; then
              ENV_VARS="$ENV_VARS,AI_MODEL=${{ vars.AI_MODEL }}"
            fi
            # A dedicated runtime account lets Cloud Run call Vertex AI without any API key (infra/setup-runtime-sa.sh)
            SA_FLAG=""
            if [ -n "${{ vars.RUNTIME_SERVICE_ACCOUNT }}" ]; then
              SA_FLAG="--service-account=${{ vars.RUNTIME_SERVICE_ACCOUNT }}"
            fi
            # Secrets are optional until Secret Manager is set up (see infra/setup-secrets.sh)
            SECRETS=""
            if gcloud secrets describe better-auth-secret >/dev/null 2>&1 && gcloud secrets describe database-url >/dev/null 2>&1; then
              LIST="BETTER_AUTH_SECRET=better-auth-secret:latest,DATABASE_URL=database-url:latest"
              # AI is optional: routes return 503 until a provider is configured
              if gcloud secrets describe anthropic-api-key >/dev/null 2>&1; then
                LIST="$LIST,ANTHROPIC_API_KEY=anthropic-api-key:latest"
              fi
              if gcloud secrets describe google-api-key >/dev/null 2>&1; then
                LIST="$LIST,GOOGLE_API_KEY=google-api-key:latest"
              fi
              if gcloud secrets describe google-client-id >/dev/null 2>&1 && gcloud secrets describe google-client-secret >/dev/null 2>&1; then
                LIST="$LIST,GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest"
              fi
              if gcloud secrets describe resend-api-key >/dev/null 2>&1 && [ -n "${{ vars.MAIL_FROM }}" ]; then
                LIST="$LIST,RESEND_API_KEY=resend-api-key:latest"
                ENV_VARS="$ENV_VARS,MAIL_FROM=${{ vars.MAIL_FROM }}"
              fi
              SECRETS="--update-secrets=$LIST"
            fi
            MEMORY=512Mi
          else
            SA_FLAG=""
            ENV_VARS="API_URL=${{ vars.API_URL }}"
            SECRETS=""
            MEMORY=512Mi
          fi

          # Everything besides the image that shapes the revision. If it changes, the service is redeployed.
          CONFIG=$(printf '%s|%s|%s|%s' "$ENV_VARS" "$SA_FLAG" "$SECRETS" "$MEMORY" | sha256sum | cut -c1-12)
          RUNNING_IMAGE=$(gcloud run services describe dropboard-${{ matrix.app }} --region "${{ vars.GCP_REGION }}" --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || true)
          RUNNING_CONFIG=$(gcloud run services describe dropboard-${{ matrix.app }} --region "${{ vars.GCP_REGION }}" --format='value(metadata.labels.config)' 2>/dev/null || true)

          if [ "${{ inputs.force }}" != true ] && [ "$RUNNING_IMAGE" = "$IMAGE" ] && [ "$RUNNING_CONFIG" = "$CONFIG" ]; then
            echo "dropboard-${{ matrix.app }} already runs this image with this configuration, nothing to deploy"
            exit 0
          fi

          gcloud run deploy dropboard-${{ matrix.app }} \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 80 \
            --cpu 1 --memory "$MEMORY" \
            --cpu-throttling \
            --cpu-boost \
            --set-env-vars "$ENV_VARS" \
            --update-labels "config=$CONFIG" \
            $SA_FLAG \
            $SECRETS
      - name: Verify
        run: |
          url=$(gcloud run services describe dropboard-${{ matrix.app }} --region "${{ vars.GCP_REGION }}" --format='value(status.url)')
          path=/health; [ "${{ matrix.app }}" = web ] && path=/
          curl -fsS --retry 5 --retry-delay 3 "$url$path" >/dev/null
