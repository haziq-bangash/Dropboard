# Local development database. Production uses a managed Postgres via DATABASE_URL.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dropboard
      POSTGRES_PASSWORD: dropboard
      POSTGRES_DB: dropboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropboard"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
